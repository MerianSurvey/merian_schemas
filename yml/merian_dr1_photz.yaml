---
name: MerianSchema
"@id": "#merianPhotZ"
description: "The photo-z table contains descriptions of the photo-z results using the GaAP photometry from the Merian DR1 photometric catalog. https://www.dropbox.com/scl/fo/95rrcc91bob4cjmvz0x59/h?rlkey=bgniiz0sofqct8uikkmez5qn9&st=idkg3s0n&dl=0"
tables:
- name: Object
  "@id": "#Object"
  columns:
  - name: objectId_Merian
    datatype: long
    description: Unique id. Unique ObjectID
    ivoa:ucd: meta.id;src
  - name: coord_ra_Merian
    datatype: double
    description: Fiducial ICRS Right Ascension of centroid used for database indexing
    fits:tunit: deg
  - name: coord_dec_Merian
    datatype: double
    description: Fiducial ICRS Declination of centroid used for database indexing
    fits:tunit: deg
  - name: tract_Merian
    "@id": "#Object.tract"
    datatype: long
    description: Skymap tract ID
    fits:tunit:
  - name: patch_Merian
    "@id": "#Object.patch"
    datatype: long
    description: Skymap patch ID
    fits:tunit:
  - name: X_gaap1p0Flux_Merian
    "@id": "#Object.g_gaap1p0Flux"
    datatype: double
    description: GAaP Flux with 1.0 aperture after multiplying the seeing by 1.15. Forced on X-band.
    fits:tunit: nJy
  - name: X_gaap1p0FluxErr_Merian
    "@id": "#Object.g_gaap1p0FluxErr"
    datatype: double
    description: GAaP Flux uncertainty with 1.0 aperture after multiplying the seeing by 1.15. Forced on X-band.
    fits:tunit: nJy
  - name: X_cModelFlux_Merian
    "@id": "#Object.g_cModelFlux"
    datatype: double
    description: Flux from the final cmodel fit. Forced on X-band.
    fits:tunit: nJy
  - name: X_cModelFluxErr_Merian
    "@id": "#Object.g_cModelFluxErr"
    datatype: double
    description: Flux uncertainty from the final cmodel fit. Forced on X-band.
    fits:tunit: nJy
  - name: i_cModelmag_Merian
    "@id": "#Object.i_cModelmag_Merian"
    datatype: double
    description: AB magnitude from the final cmodel fit.
    fits:tunit: mag
  - name: IS_MASKED_0.5teff
    "@id": "#Object.IS_MASKED_0.5teff"
    datatype: boolean
    description: True if source has t_effective ratio above 0.5
    fits:tunit:
  - name: IS_MASKED_0.9teff
    "@id": "#Object.IS_MASKED_0.5teff"
    datatype: boolean
    description: True if source has t_effective ratio above 0.9
    fits:tunit:
  - name: z025, z160, z500, z840, z975
    "@id": "#Object.z025"
    datatype: double
    description: 2.5, 16, 50, 84, 97.5 percent of p(z) from EAZY
    fits:tunit: redshift
  - name: min_risk
    "@id": "#Object.min_risk"
    datatype: double
    description: risk parameter R(zphot) from EAZY
    fits:tunit:
  - name: raw_chi2
    "@id": "#Object.raw_chi2"
    datatype: double
    description: chi2 of the EAZY photo-z
    fits:tunit:
  - name: zphot_width
    "@id": "#Object.zphot_width"
    datatype: double
    description: 2-sigma width of the EAZY photo-z PDF
    fits:tunit:
  - name: z_spec
    "@id": "#Object.z_spec"
    datatype: double
    description: spec-z's from existing surveys (COSMOS, GAMA, SDSS, DESI, etc.) and Merian team (DEIMOS/600ZD, DEIMOS/1200G, IMACS, DESIxMerian)
    fits:tunit: redshift
  - name: z_spec_source
    "@id": "#Object.z_spec_source"
    datatype: string
    description: source of the spec-z's
    fits:tunit:
